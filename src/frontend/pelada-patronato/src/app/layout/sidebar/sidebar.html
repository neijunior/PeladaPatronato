<div
  class="
    fixed md:static
    top-0 left-0
    h-screen w-64
    bg-gray-800 text-gray-100
    p-4 flex flex-col
    z-40
    transform transition-transform duration-300
    md:translate-x-0
  "
  [class.-translate-x-full]="!sidebar.isOpen"
>
  <div class="mb-8 font-bold text-xl flex justify-between items-center">
    Pelada Patronato
    <button class="md:hidden" (click)="sidebar.close()">✕</button>
  </div>

  <nav class="flex-1 flex flex-col space-y-2 overflow-y-auto">
  <ng-container *ngFor="let item of menu">
    
    <!-- Item simples -->
    <a *ngIf="!item.children"
       [routerLink]="item.path"
       routerLinkActive="bg-gray-700 text-white"
       class="block px-4 py-2 rounded hover:bg-gray-700 transition-colors"
       (click)="sidebar.close()">
      {{ item.label }}
    </a>

    <!-- Item com filhos -->
    <div *ngIf="item.children" class="flex flex-col">
      <span class="block px-4 py-2 rounded hover:bg-gray-700 transition-colors font-semibold cursor-pointer"
            (click)="item.expanded = !item.expanded">
        {{ item.label }}
        <span class="float-right">{{ item.expanded ? '▾' : '▸' }}</span>
      </span>

      <div *ngIf="item.expanded" class="ml-4 flex flex-col space-y-1">
        <a *ngFor="let child of item.children"
           [routerLink]="child.path"
           routerLinkActive="bg-gray-700 text-white"
           class="block px-4 py-2 rounded hover:bg-gray-700 transition-colors"
           (click)="sidebar.close()">
          {{ child.label }}
        </a>
      </div>
    </div>

  </ng-container>
</nav>
</div>
