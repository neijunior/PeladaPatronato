<div class="min-h-screen bg-gray-900 text-gray-100 flex items-center justify-center p-6">
  <div class="w-full max-w-md bg-gray-800 rounded-lg shadow-lg p-8">

    <h1 class="text-2xl font-bold mb-6 text-center">Acesso ao Sistema</h1>

    <form (ngSubmit)="login()" #form="ngForm" class="space-y-4">

      <!-- Email -->
      <div>
        <label class="block text-sm text-gray-400 mb-1">Email</label>
        <input
          type="email"
          [(ngModel)]="nomeUsuario"
          name="email"
          required
          class="w-full px-4 py-2 rounded bg-gray-700 border border-gray-600 
                 focus:outline-none focus:ring-2 focus:ring-blue-600"
          placeholder="Digite seu email"
        />
      </div>

      <!-- Senha -->
      <div>
        <label class="block text-sm text-gray-400 mb-1">Senha</label>
        <input
          type="password"
          [(ngModel)]="senha"
          name="senha"
          required
          class="w-full px-4 py-2 rounded bg-gray-700 border border-gray-600 
                 focus:outline-none focus:ring-2 focus:ring-blue-600"
          placeholder="Digite sua senha"
        />
      </div>

      <!-- Mensagem de erro -->
      <div *ngIf="erro" class="text-red-400 text-sm">
        {{ erro }}
      </div>

      <!-- Botão -->
      <button
        type="submit"
        [disabled]="form.invalid || carregando"
        class="w-full bg-blue-600 hover:bg-blue-700 
               disabled:bg-gray-600 disabled:cursor-not-allowed
               text-white font-medium py-2 rounded transition"
      >
        {{ carregando ? 'Entrando...' : 'Entrar' }}
      </button>

    </form>

  </div>
</div>
