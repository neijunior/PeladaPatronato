<div class="bg-gray-800 p-6 rounded-2xl shadow-md space-y-6">

  <h2 class="text-xl font-semibold text-white">
    Montagem de Times
  </h2>

  <!-- Selecionar Time -->
  <div>
    <label class="text-sm text-gray-400">Time</label>
    <select class="w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white"
      [(ngModel)]="timeSelecionado">

      <option [ngValue]="null">Selecione</option>
      <option *ngFor="let t of timesDisponiveisFiltrados" [ngValue]="t.id">
        {{ t.nome }}
      </option>

    </select>
  </div>

  <!-- Selecionar Participantes -->
  <div>
    <label class="text-sm text-gray-400">Participantes ({{ participantesSelecionados.length }} selecionados)</label>

    <div class="mt-2 bg-gray-900 border border-gray-700 rounded-lg p-3 max-h-52 overflow-y-auto grid grid-cols-4 gap-2">

      <label *ngFor="let p of participantesDisponiveis" class="flex items-center gap-2 text-white cursor-pointer">

        <input type="checkbox" class="accent-blue-500" [checked]="participantesSelecionados.includes(p.id)"
          (change)="toggleParticipante(p.id)" />

        {{ p.nome }}

      </label>

    </div>

  </div>

  <!-- Botão adicionar -->
  <button class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded-lg text-white" (click)="adicionarTimeTemp()">

    Adicionar Time

  </button>

  <!-- Lista temporária -->
  <app-times-montados [times]="timesTemp" [obterNomeTime]="obterNomeTime.bind(this)"
    [obterNomeParticipante]="obterNomeParticipante.bind(this)">
  </app-times-montados>

  <!-- Botão salvar -->
  <button class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-white" (click)="salvarTimes()">

    Salvar Times

  </button>

</div>
