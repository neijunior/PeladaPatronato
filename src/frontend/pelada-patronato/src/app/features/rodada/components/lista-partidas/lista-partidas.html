<div *ngIf="timesDisponiveis && novaPartida && partidas"  class="bg-gray-800 p-6 rounded-2xl shadow-md space-y-6">

    <!-- TÍTULO -->
    <h2 class="text-xl font-semibold text-white">
        Cadastro de Partidas
    </h2>

    <!-- CRIAÇÃO -->
    <div *ngIf="podeAdicionarPartida" class="bg-gray-700 p-5 rounded-xl border border-gray-600">

        <div class="grid grid-cols-1 md:grid-cols-5 gap-4">

            <!-- ORDEM -->
            <div>
                <label class="text-sm text-gray-300">Ordem</label>
                <div class="mt-1 p-2 rounded-lg bg-gray-900 text-gray-400 border border-gray-700">
                    {{ proximaOrdem }}
                </div>
            </div>

            <!-- TIME A -->
            <div>
                <label class="text-sm text-gray-300">Time A</label>
                <select [(ngModel)]="novaPartida.timeA"
                    class="w-full mt-1 p-2 rounded-lg bg-gray-800 text-white border border-gray-600">

                    <option [ngValue]="null">Selecione</option>

                    <option *ngFor="let t of timesDisponiveis" [ngValue]="t">
                        {{ t.nome }}
                    </option>

                </select>
            </div>

            <!-- TIME B -->
            <div>
                <label class="text-sm text-gray-300">Time B</label>
                <select [(ngModel)]="novaPartida.timeB"
                    class="w-full mt-1 p-2 rounded-lg bg-gray-800 text-white border border-gray-600">

                    <option [ngValue]="null">Selecione</option>

                    <option *ngFor="let t of timesDisponiveis" [ngValue]="t">
                        {{ t.nome }}
                    </option>

                </select>
            </div>

            <!-- POSSE -->
            <div>
                <label class="text-sm text-gray-300">Começa</label>

                <select [(ngModel)]="novaPartida.iniciaCom"
                    class="w-full mt-1 p-2 rounded-lg bg-gray-800 text-white border border-gray-600">

                    <option value="A">Time A</option>
                    <option value="B">Time B</option>

                </select>
            </div>

            <!-- BOTÃO -->
            <div class="flex items-end">
                <button (click)="adicionarPartida()" [disabled]="!novaPartida.timeA || !novaPartida.timeB"
                    class="w-full bg-green-600 hover:bg-green-500 disabled:bg-gray-500 text-white py-2 rounded-lg font-semibold">
                    Adicionar
                </button>
                <button (click)="alterarStatusRodada(3)" [disabled]="partidas.length < 2"
                    class="w-full bg-green-600 hover:bg-green-500 disabled:bg-gray-500 text-white py-2 ml-2 rounded-lg font-semibold">
                    Fechar
                </button>
            </div>

        </div>

    </div>

    <!-- LISTA -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">



        <div *ngFor="let p of partidas" (click)="selecionarPartida(p)"
            class="cursor-pointer bg-gray-700 hover:bg-gray-600 transition rounded-xl p-4 shadow flex items-center justify-between">

            <!-- ORDEM -->
            <div class="flex items-center gap-4">

                <div
                    class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-900 text-gray-300 font-semibold">
                    {{ p.ordem }}
                </div>

                <!-- TIMES -->
                <div class="flex items-center gap-3 text-white font-medium">

                    <span class="min-w-[100px] text-right">
                        {{ p.timeA.nome }}
                    </span>

                    <span class="text-gray-400 font-bold">
                        VS
                    </span>

                    <span class="min-w-[100px]">
                        {{ p.timeB.nome }}
                    </span>

                </div>

            </div>
        </div>


        <!-- VAZIO -->
        <div *ngIf="partidas.length === 0" class="text-center text-gray-400 py-6">
            Nenhuma partida cadastrada
        </div>

    </div>

</div>
